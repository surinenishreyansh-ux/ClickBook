name: ClickBook dependency security audit

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'backend/requirements.txt'
      - 'frontend/package-lock.json'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Python dependencies for known CVEs
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit --requirement backend/requirements.txt --progress-spinner off

  frontend-production-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit shipped runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
