# Render Blueprint template for NEW ClickBook deployments only.
# The existing Render web service was created directly; this does not alter it.
# Never upgrade to a paid instance without the owner's explicit approval.
services:
  - type: web
    name: clickbook-live
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CLICKBOOK_SETUP_MODE
        value: "1"
      - key: STORAGE_DRIVER
        value: local
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_MAX_ASSET_MB
        value: "10"
